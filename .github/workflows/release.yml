name: Manual package release
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Explicitly reviewed unpublished package version (existing versions are immutable)
        required: true
        type: string
      dry_run:
        description: Inspect publication without uploading
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: kooyaph-ui-release
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'KooyaPH/kooya-ui'
    runs-on: [self-hosted, Linux, X64, mid-runner]
    timeout-minutes: 20
    env:
      CI: "true"
      STORYBOOK_DISABLE_TELEMETRY: "1"
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.3"
      - run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - run: corepack pnpm install --frozen-lockfile
      - name: Confirm reviewed version
        run: node -e "const p=require('./packages/ui/package.json');if(p.version!==process.env.EXPECTED_VERSION)throw Error('Version mismatch');"
      - run: corepack pnpm validate
  publish:
    if: github.repository == 'KooyaPH/kooya-ui'
    needs: qualify
    runs-on: [self-hosted, Linux, X64, mid-runner]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.3"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kooyaph"
      - run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @kooyaph/ui build
      - name: Preview package publication
        if: inputs.dry_run
        working-directory: packages/ui
        run: npm publish --dry-run --access restricted
      - name: Publish reviewed package
        if: ${{ !inputs.dry_run }}
        working-directory: packages/ui
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
